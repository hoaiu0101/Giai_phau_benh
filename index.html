<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HA · Giải phẫu bệnh">


<title>Ôn thi Giải phẫu bệnh</title>
<style>
:root{
  --blue:#1d4ed8;--blue-600:#2563eb;--blue-50:#eff6ff;--blue-100:#dbeafe;--blue-200:#bfdbfe;
  --ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f5f8ff;--card:#fff;
  --ok:#059669;--ok-bg:#ecfdf5;--bad:#dc2626;--bad-bg:#fef2f2;--warn:#b45309;--warn-bg:#fffbeb;
  --r:14px;--shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(29,78,216,.06);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.top-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;overflow:hidden;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.top h1{font-size:16px;margin:0;line-height:1.2}
.top small{color:var(--muted);font-size:12.5px}
main{max-width:860px;margin:0 auto;padding:16px 16px calc(96px + var(--safe-b))}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 4px calc(6px + var(--safe-b))}
nav.tabs .in{display:flex;max-width:860px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px;border-radius:10px;color:var(--muted);
  font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--blue);font-weight:600}
@media(min-width:900px){
  nav.tabs{position:sticky;top:57px;bottom:auto;border:0;border-bottom:1px solid var(--line);padding:4px}
  nav.tabs button{flex-direction:row;justify-content:center;gap:8px;font-size:14px;min-height:44px}
  main{padding-bottom:40px}
}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:16px;margin:18px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.muted{color:var(--muted)}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.g4{grid-template-columns:repeat(4,1fr)}}
.g4{grid-template-columns:repeat(2,1fr)}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:24px;line-height:1.2;color:var(--blue);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 18px;border-radius:12px;
  border:1px solid var(--blue);background:var(--blue);color:#fff;font-weight:600;font-size:15.5px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--blue);border-color:var(--blue-200)}
.btn.soft{background:var(--blue-50);color:var(--blue);border-color:var(--blue-100)}
.btn.danger{background:#fff;color:var(--bad);border-color:#fecaca}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.bad{background:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;min-height:40px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.bar{height:8px;background:var(--blue-100);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin-bottom:8px}
.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--blue-50);color:var(--blue);font-weight:600}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.qtext{font-size:17.5px;font-weight:600;line-height:1.45;margin:10px 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:12px;padding:13px 14px;min-height:54px;font-size:16px;line-height:1.4}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--blue-50);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt:hover{border-color:var(--blue-200)}
.opt.sel{border-color:var(--blue);background:var(--blue-50)}
.opt.sel .k{background:var(--blue);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);border:1px solid #a7f3d0}
.fb.bad{background:var(--bad-bg);border:1px solid #fecaca}
.fb b.t{display:block;margin-bottom:4px}
.flag{margin-top:10px;background:var(--warn-bg);border:1px solid #fde68a;color:#78350f;border-radius:12px;padding:10px 12px;font-size:14px}
.nav3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.nav3 .btn{padding:10px 6px;font-size:15px}
select,input[type=number]{font:inherit;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;width:100%}
label.f{display:block;font-size:13.5px;color:var(--muted);margin:12px 0 6px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue);background:var(--blue-50);padding:6px 12px;border-radius:10px}
.timer.low{color:var(--bad);background:var(--bad-bg)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.qgrid button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px;font-variant-numeric:tabular-nums}
.qgrid button.ans{background:var(--blue-100);border-color:var(--blue-200)}
.qgrid button.cur{outline:2px solid var(--blue)}
.qgrid button.r{background:var(--ok-bg);border-color:#a7f3d0;color:var(--ok)}
.qgrid button.w{background:var(--bad-bg);border-color:#fecaca;color:var(--bad)}
.qgrid button.s{background:#f1f5f9;color:var(--muted)}
/* flashcard */
.fc-wrap{perspective:1200px}
.fc{position:relative;width:100%;min-height:340px;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:22px 20px;
  display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);overflow:auto}
.fc .back{transform:rotateY(180deg);background:linear-gradient(180deg,#fff, var(--blue-50))}
.fc .face .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.fc .front .q{font-size:18px;font-weight:600;margin:auto 0;line-height:1.45}
.fc .back .ans{font-size:20px;font-weight:700;color:var(--blue);margin:12px 0 10px}
.fc .hint{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it .q{font-size:14.5px}
.pill{font-size:12.5px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.ok{background:var(--ok-bg);color:var(--ok)}
.topicrow{margin:10px 0}
.topicrow .lab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}
.score{font-size:44px;font-weight:800;color:var(--blue);line-height:1;font-variant-numeric:tabular-nums}
table.h{width:100%;border-collapse:collapse;font-size:14px}
table.h th,table.h td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
table.h th{color:var(--muted);font-weight:600;font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.sec-title{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo" title="Hoàng Anh yêu Hoa"><img src="logo.jpg" alt="HA"></div>
  <div><h1>Ôn thi Giải phẫu bệnh</h1>
  <small id="subtitle">75 câu · 3 chủ đề · <span style="color:#e11d48;font-weight:600">Hoàng Anh yêu Hoa</span></small></div>
</div></header>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<main id="app"><noscript>Vui lòng bật JavaScript để dùng trang ôn tập.</noscript></main>
<div class="toast" id="toast"></div>
<script>

// Ngân hàng câu hỏi — Giải phẫu bệnh (Bài 1–8)
// Đáp án dựa trên kiến thức GPB chuẩn; một số câu ghi chú cần đối chiếu slide.
// a = đáp án đúng, d = 3 nhiễu, e = giải thích. Thứ tự đáp án đảo khi hiển thị.
const TOPICS = {
  dc: "Đại cương GPB & Tổn thương tế bào (Bài 1-3)",
  th: "Rối loạn tuần hoàn & Viêm (Bài 4-5)",
  u: "U & Bệnh lý khoang miệng (Bài 6-8)"
};

const QUESTIONS = [{"id": 1, "t": "dc", "q": "Giải phẫu bệnh là môn học nghiên cứu về (Chọn câu sai)", "a": "Đặc điểm đại thể và vi thể của mô bình thường và mô bệnh.", "d": ["Đặc điểm giải phẫu bệnh và tế bào học của mô bệnh.", "Đặc điểm mô bệnh học của tổn thương.", "Bao gồm tế bào học."], "e": "GPB nghiên cứu mô BỆNH, không nghiên cứu mô bình thường → phát biểu này sai nên là đáp án."}, {"id": 2, "t": "dc", "q": "Độ chính xác của một xét nghiệm giải phẫu bệnh còn phụ thuộc vào:", "a": "Cả 3 đều đúng", "d": ["Lấy đúng vị trí tổn thương", "Lấy đủ bệnh phẩm", "Bảo quản tốt bệnh phẩm"], "e": "Cả vị trí, số lượng và bảo quản bệnh phẩm đều ảnh hưởng độ chính xác. (Phương án “Cả 3 đều đúng” luôn được đặt cuối khi đảo đáp án.)"}, {"id": 3, "t": "dc", "q": "Cuốn sách \"Về nguyên nhân bệnh tật\" của Morgagni đặt nền tảng cho những hiểu biết gì về giải phẫu bệnh?", "a": "Đại thể", "d": ["Vi thể", "Nhiễm sắc thể", "Gen"], "e": "Morgagni là người đặt nền tảng bệnh học đại thể (thế kỷ 18)."}, {"id": 4, "t": "dc", "q": "Nhà giải phẫu bệnh người Đức, R. Virchow đã khẳng định bệnh tật là do những tổn thương, rối loạn ở mức độ nào?", "a": "Tế bào", "d": ["Tạng, hệ cơ quan", "Nhiễm sắc thể", "Gen"], "e": "Virchow: \"Omnis cellula e cellula\" – bệnh học tế bào."}, {"id": 5, "t": "dc", "q": "Nội dung nghiên cứu của giải phẫu bệnh là gì?", "a": "Bệnh học", "d": ["Di truyền học", "Dịch tễ học", "Nhân trắc học"], "e": "Giải phẫu bệnh = Pathology (bệnh học hình thái)."}, {"id": 6, "t": "dc", "q": "Đâu không phải là đặc điểm hình thái của tế bào hoại tử?", "a": "Nhân quái", "d": ["Nhân đông", "Nhân vỡ", "Nhân tan"], "e": "Nhân quái (bizarre nucleus) gặp ở tế bào u ác, không phải đặc điểm hoại tử kinh điển (pyknosis, karyorrhexis, karyolysis)."}, {"id": 7, "t": "dc", "q": "Một bệnh nhân lớn tuổi, có huyết áp tâm thu và tâm trương là 165/105 mmHg kéo dài mà không điều trị, tế bào cơ tim có thể bị loại tổn thương nào?", "a": "Phì đại", "d": ["Teo đét tế bào", "Chuyển sản", "Tăng sản"], "e": "Tăng huyết áp mạn → phì đại đồng tâm thất trái (hypertrophy)."}, {"id": 8, "t": "dc", "q": "Tử cung của một phụ nữ mang thai to ra là nhờ tế bào cơ trơn tử cung biến đổi dạng gì?", "a": "Cả tăng sản và phì đại", "d": ["Tăng sản", "Phì đại", "Chuyển sản"], "e": "Thai kỳ: cả hypertrophy lẫn hyperplasia của cơ trơn tử cung."}, {"id": 9, "t": "dc", "q": "Sự calci hóa mảng xơ vữa động mạch là gì?", "a": "Thuộc loại calci hóa nghịch dưỡng", "d": ["Là một hiện tượng lắng đọng nội bào", "Thuộc loại calci hóa di căn", "Vừa là lắng đọng nội bào, vừa là calci hóa nghịch dưỡng"], "e": "Calci lắng đọng trên mô tổn thương/hoại tử khi calci máu bình thường = calci hóa nghịch dưỡng (dystrophic); gần như luôn có trong mảng xơ vữa tiến triển. Ở mảng xơ vữa, calci lắng chủ yếu trong lõi hoại tử và chất nền ngoại bào, không phải “lắng đọng nội bào” → phương án “Vừa là lắng đọng nội bào…” (A và B đúng trong đề gốc) sai."}, {"id": 10, "t": "dc", "q": "Loại hoại tử đặc trưng của tổn thương nhiễm lao là gì?", "a": "Hoại tử bã đậu", "d": ["Hoại tử đông", "Hoại tử hóa lỏng", "Hoại tử mỡ"], "e": "Caseous necrosis đặc trưng cho lao (và một số nấm)."}, {"id": 11, "t": "dc", "q": "Phù thông thường là hiện tượng:", "a": "Ứ nước ngoài tế bào", "d": ["Ứ nước trong tế bào", "Ứ nước cả trong và ngoài tế bào", "Ứ nước ở bào quan"], "e": "Phù (edema) = tích tụ dịch trong khoảng kẽ (ngoại bào). Ứ nước trong tế bào là hydropic change."}, {"id": 12, "t": "dc", "q": "Dịch tiết của phù hay gặp trong:", "a": "Lao màng bụng và K gan", "d": ["Xơ gan", "Suy thận", "Gan tim"], "e": "Dịch tiết (exudate) giàu protein – gặp trong viêm/u (lao màng bụng, carcinomatosis)."}, {"id": 13, "t": "dc", "q": "Dịch thấm của phù hay gặp trong:", "a": "Xơ gan", "d": ["Ung thư gan", "Ung thư thận", "Lao màng bụng"], "e": "Dịch thấm (transudate) nghèo protein – xơ gan, suy tim, hội chứng thận hư."}, {"id": 14, "t": "dc", "q": "Tình trạng (hiện tượng) nào sau đây không là nguyên nhân trực tiếp dẫn tới huyết khối:", "a": "Chấn thương mạch máu", "d": ["Ứ trệ tuần hoàn", "Xơ mỡ động mạch", "Viêm thành mạch máu"], "e": "Đáp án theo đề/giảng viên: Chấn thương mạch máu. Ứ trệ tuần hoàn, xơ mỡ động mạch, viêm thành mạch là các tình trạng trực tiếp gây hình thành huyết khối (tam giác Virchow: tổn thương nội mô, ứ trệ, tăng đông)."}, {"id": 15, "t": "dc", "q": "Hậu quả thường gặp và nghiêm trọng nhất do huyết khối gây ra là:", "a": "Tắc mạch, gây nhồi máu phủ tạng", "d": ["Vỡ mạch gây xuất huyết", "Hẹp lòng mạch gây hoại tử tổ chức", "Nhiễm trùng huyết"], "e": "Huyết khối → huyết tắc → nhồi máu là hậu quả nặng nề thường gặp nhất."}, {"id": 16, "t": "dc", "q": "Hình ảnh đại thể đặc trưng của phù là:", "a": "Cơ quan bị phù lớn hơn bình thường, màu nhạt", "d": ["Cơ quan bị phù sưng to, màu đỏ sẫm", "Khi cắt ngang có màu đỏ thẫm chảy ra", "Không có hình ảnh đặc trưng"], "e": "Phù: cơ quan to hơn, màu nhạt, khi cắt có dịch trong chảy ra."}, {"id": 17, "t": "dc", "q": "Triệu chứng viêm cấp tính của Celsus nêu ra là:", "a": "Sưng, nóng, đỏ, đau", "d": ["Sưng, nóng, đỏ, đau, mất chức năng cơ quan", "Sưng, nóng, đỏ, đau giãn các vi mạch", "Sưng, nóng, đỏ, đau, thâm nhiễm bạch cầu."], "e": "4 dấu hiệu Celsus: rubor, tumor, calor, dolor. (Virchow thêm functio laesa)."}, {"id": 18, "t": "dc", "q": "Biểu hiện nóng đỏ của ổ viêm cấp tính là do:", "a": "Sung huyết động", "d": ["Sung huyết tĩnh", "Xuất huyết vi thể", "Tăng tính thấm thành mạch"], "e": "Nóng + đỏ do tăng lưu lượng máu động mạch (hyperemia)."}, {"id": 19, "t": "dc", "q": "Cơ chế gây sưng trong viêm cấp:", "a": "Dãn mạch - dịch thoát mạch - hoá hướng động", "d": ["Dịch thoát mạch - hoá hướng động - tăng lưu lượng máu", "Phóng thích các chất trung gian hoà tan - dịch thoát mạch - hoá hướng động", "Dãn mạch - dịch thoát mạch - tăng chuyển hoá"], "e": "Sưng = phù viêm (dãn mạch + tăng tính thấm → dịch thoát mạch) + thấm nhập tế bào viêm (hoá hướng động kéo bạch cầu ra mô). Tăng chuyển hoá (cùng tăng tuần hoàn) giải thích triệu chứng NÓNG, không phải sưng.", "f": "Phương án “Phóng thích các chất trung gian hoà tan – dịch thoát mạch – hoá hướng động” cũng có thể bảo vệ được; phương án “… tăng chuyển hoá” chắc chắn sai. Nên đối chiếu đáp án của bộ môn."}, {"id": 20, "t": "dc", "q": "Viêm có những hiện tượng diễn tiến tuần tự như sau:", "a": "Huyết quản huyết, hiện tượng hóa sinh, tế bào và mô, hủy hoại và hàn gắn", "d": ["Hiện tượng hóa sinh, huyết quản huyết, tế bào và mô, hủy hoại và hàn gắn", "Hiện tượng hóa sinh, tế bào và mô, huyết quản huyết, hủy hoại và hàn gắn", "Hủy hoại và hàn gắn, hiện tượng hóa sinh, huyết quản huyết, tế bào và mô"], "e": "Thứ tự theo giáo trình: huyết quản huyết → hiện tượng hóa sinh → tế bào và mô → hủy hoại và hàn gắn."}, {"id": 21, "t": "dc", "q": "Histamin được tiết ra từ tế bào nào trong viêm, TRỪ MỘT:", "a": "Tế bào lympho (lymphocyte)", "d": ["Tiểu cầu (platelets)", "Tế bào bón (mast cell)", "Tế bào BC đa nhân ưa kiềm (basophille)"], "e": "Histamin từ mast cell, basophil, platelet. Lymphocyte không tiết histamin."}, {"id": 22, "t": "dc", "q": "Phản ứng của mạch máu trong viêm cấp tính thường có hiện tượng nào, TRỪ MỘT:", "a": "Hiện tượng dày thành mạch", "d": ["Hiện tượng thấm mạch", "Hiện tượng xuyên mạch", "Hiện tượng phù nề"], "e": "Viêm cấp: giãn mạch, tăng thấm, xuyên bạch cầu, phù. Dày thành mạch không phải hiện tượng cấp."}, {"id": 23, "t": "th", "q": "Hình thái tổn thương vi thể của phù:", "a": "Mô kẽ bị lỏng lẻo ứ đọng dịch.", "d": ["Tế bào trương to, bào tương nhạt", "Các mạch máu giãn rộng chứa đầy hồng cầu", "Các tế bào dạng biểu mô có nhân hình bầu dục, bào tương sáng"], "e": "Phù vi thể: khoảng kẽ giãn, ứ dịch, mô lỏng lẻo."}, {"id": 24, "t": "th", "q": "Phát biểu nào sau đây không đúng khi nói về phù:", "a": "Cổ trướng trong xơ gan do tăng áp lực tĩnh mạch cửa là một loại phù viêm.", "d": ["Trong phù viêm, dịch ứ đọng là dịch xuất.", "Giảm áp lực thẩm thấu keo huyết tương ở bệnh nhân mắc hội chứng thận hư là phù không do viêm.", "Dịch thấm là dịch ứ đọng trong phù không do viêm"], "e": "Cổ trướng xơ gan là phù không viêm (transudate do tăng áp lực thủy tĩnh + giảm albumin), không phải phù viêm."}, {"id": 25, "t": "th", "q": "Định nghĩa sung huyết:", "a": "Sự gia tăng quá mức lượng máu còn trong mô và cơ quan.", "d": ["Sự gia tăng quá mức lượng máu còn trong lòng mạch máu ở mô và cơ quan.", "Sự gia tăng quá mức lượng máu còn trong lòng mao mạch ở mô và cơ quan.", "Sự gia tăng quá mức lượng máu còn trong lòng tĩnh mạch ở mô và cơ quan"], "e": "Giáo trình GPB (PNT): sung huyết là tình trạng gia tăng quá mức lượng máu chứa trong mô – cơ quan (đề viết “còn trong”). Câu định nghĩa huyết tắc của cùng đề cũng dùng định nghĩa này làm phương án nhiễu. Sung huyết động và sung huyết tĩnh là 2 loại của sung huyết."}, {"id": 26, "t": "th", "q": "Sung huyết động, câu nào sau đây không đúng?", "a": "Cơ chế gây sung huyết động là do tăng tính thấm thành mạch.", "d": ["Là sự tăng quá mức lượng máu vào hệ thống mao mạch do sự giãn nở của các động mạch và tiểu động mạch.", "Vùng mô có màu đỏ tươi, nhiệt độ tăng cao.", "Nặng có thể gây phù do ứ đọng dịch xuất thanh huyết."], "e": "Sung huyết động do giãn động mạch/tiểu động mạch (active hyperemia), không phải do tăng tính thấm."}, {"id": 27, "t": "th", "q": "Các nguyên nhân dẫn đến xuất huyết, ngoại trừ:", "a": "Bệnh lý tim bẩm sinh.", "d": ["Do các chấn thương gây đứt vỡ thành mạch.", "Bệnh lý thành mạch: Phình mạch, xơ vữa động mạch, viêm mạch máu.", "Bệnh lý đông-cầm máu: các bệnh giảm tiểu cầu máu, bệnh ưa chảy máu."], "e": "Xuất huyết do: tổn thương mạch, bệnh thành mạch, rối loạn đông cầm máu. Tim bẩm sinh không phải nguyên nhân trực tiếp."}, {"id": 28, "t": "th", "q": "Các hướng tiến triển của huyết khối (Chọn câu sai)", "a": "Trở thành viêm mạn tính", "d": ["Tan hoàn toàn", "Tiếp tục phát triển thêm, di chuyển gây huyết tắc", "Tổ chức hóa"], "e": "Huyết khối: ly giải, tổ chức hóa, tái thông, hoặc tắc/huyết tắc. Không \"trở thành viêm mạn\"."}, {"id": 29, "t": "th", "q": "Định nghĩa huyết tắc?", "a": "Vật thể di chuyển trong dòng máu sau đó bị giữ lại làm lấp kín lòng mạch", "d": ["Hình thành cục máu đông bất thường trong hệ thống tuần hoàn của người sống", "Là sự gia tăng quá mức lượng máu chứa trong mô-cơ quan", "Là tình trạng hoại tử 1 vùng mô, cơ quan do thiếu máu cục bộ, gây ra bởi sự tắc nghẽn động mạch nuôi hoặc tĩnh mạch dẫn lưu tương ứng"], "e": "Huyết tắc (embolism) = vật thể di chuyển rồi kẹt lại gây tắc mạch. (Huyết khối = thrombosis)."}, {"id": 30, "t": "th", "q": "Nhồi máu trắng không gặp ở:", "a": "Phổi", "d": ["Tim", "Thận", "Não"], "e": "Phổi có tuần hoàn kép → thường nhồi máu đỏ (hemorrhagic). Nhồi máu trắng gặp ở cơ quan đặc (tim, thận, lách, não)."}, {"id": 31, "t": "th", "q": "Nhồi máu:", "a": "Là tình trạng hoại tử 1 vùng mô, cơ quan do thiếu máu cục bộ, gây ra bởi sự tắc nghẽn động mạch hoặc tĩnh mạch.", "d": ["Là tình trạng giảm máu nuôi do tắc động mạch or tĩnh mạch.", "Là sự hình thành 1 cục máu đông bất thường trong lòng hệ tuần hoàn.", "Là tình trạng máu thoát ra khỏi lòng mạch nhưng vẫn còn nằm bên trong cơ thể."], "e": "Infarct = hoại tử do thiếu máu cục bộ."}, {"id": 32, "t": "th", "q": "Chọn câu đúng về định nghĩa của sốc?", "a": "Là tình trạng suy giảm tuần hoàn cấp làm lưu lượng máu ở mô bị thiếu hụt, dẫn đến vô oxy ở tế bào.", "d": ["Vật thể di chuyển trong dòng máu sau đó bị giữ lại làm lấp kín lòng mạch gây thiếu máu mô.", "Sự ứ đọng lượng dịch bất thường trong mô kẽ gian bào hoặc trong khoang cơ thể.", "Tất cả đều đúng."], "e": "Shock = giảm tưới máu mô toàn thân cấp → thiếu oxy tế bào."}, {"id": 33, "t": "th", "q": "Định nghĩa viêm?", "a": "Viêm là phản ứng của hệ thống vi tuần hoàn dẫn đến sự di chuyển dịch và bạch cầu ra các mô ngoài mạch, luôn luôn đi đôi với quá trình sửa chữa.", "d": ["Viêm là phản ứng của hệ thống tuần hoàn dẫn đến sự di chuyển dịch và bạch cầu trong máu ra các mô ngoài mạch, luôn luôn đi đôi với quá trình sửa chữa.", "Viêm là phản ứng của hệ thống vi tuần hoàn dẫn đến sự di chuyển dịch và bạch cầu ra các mô ngoài mạch, không nhất thiết đi đôi với sự sửa chữa.", "Viêm là phản ứng của hệ thống vi tuần hoàn dẫn đến sự di chuyển dịch và bạch cầu trong máu ra các mô trong mạch, không nhất thiết đi đôi với quá trình sửa chữa."], "e": "Định nghĩa chuẩn: phản ứng của vi tuần hoàn → thoát dịch & bạch cầu ra ngoài mạch, luôn kèm sửa chữa."}, {"id": 34, "t": "th", "q": "Viêm cấp (Chọn câu đúng)", "a": "Khởi phát đột ngột, diễn tiến nhanh.", "d": ["Khởi phát đột ngột, diễn tiến chậm.", "Sưng, nóng, đỏ, đau, mất chức năng nhưng biểu hiện không rõ ràng", "Khởi phát đột ngột sau đó kéo dài."], "e": "Viêm cấp: khởi phát nhanh, diễn tiến ngắn (giờ–ngày)."}, {"id": 35, "t": "th", "q": "Đặc điểm mô học viêm cấp gồm (Chọn câu sai)", "a": "Thấm nhập tế bào đơn nhân", "d": ["Sung huyết động", "Phù viêm", "Thấm nhập tế bào đa nhân"], "e": "Viêm cấp: neutrophil (đa nhân). Đơn nhân (macrophage, lympho) là viêm mạn."}, {"id": 36, "t": "th", "q": "Biểu hiện nóng, đỏ của ổ viêm cấp do (Chọn câu đúng)", "a": "Sung huyết động", "d": ["Sung huyết tĩnh", "Phù viêm", "Thấm nhập tế bào"], "e": "Nóng + đỏ = active hyperemia."}, {"id": 37, "t": "th", "q": "Phát biểu nào sau đây đúng khi nói về quá trình thấm nhập tế bào trong viêm cấp?", "a": "Gồm 3 giai đoạn, diễn ra theo trình tự: Tụ vách, xuyên thành và hóa ứng động", "d": ["Gồm 3 giai đoạn, diễn ra theo trình tự: Ôm bắt, nhận biết và kết dính, tiêu hóa", "Gồm 3 giai đoạn, diễn ra theo trình tự: Thu hút, tăng sinh tại chỗ và ức chế di chuyển", "Gồm 3 giai đoạn, diễn ra theo trình tự: Nhận biết và kết dính, ôm bắt, tiêu hóa"], "e": "Leukocyte extravasation: margination → transmigration → chemotaxis. (Phagocytosis là bước sau)."}, {"id": 38, "t": "th", "q": "Hướng diễn tiến của viêm cấp", "a": "Gồm 3 kết cục chính: tan hoàn toàn, hóa sẹo, chuyển thành viêm mạn", "d": ["Hóa sẹo: mô bị phá hủy nhiều, mô thuộc loại không thể tái tạo, dịch xuất tơ huyết dễ hấp thu dẫn đến mô liên kết sợi thay thế và hình thành sẹo hóa.", "Viêm cấp có thể chuyển thành viêm mạn khi không loại trừ được các tác nhân gây tổn thương", "Tất cả viêm cấp đều chuyển thành viêm mạn"], "e": "3 kết cục của viêm cấp: tan hoàn toàn, hoá sẹo, chuyển thành viêm mạn. Phương án “Hoá sẹo… dịch xuất tơ huyết DỄ hấp thu” sai – giáo trình ghi dịch xuất tơ huyết KHÓ tái hấp thu. “Tất cả viêm cấp đều chuyển thành viêm mạn” sai.", "f": "Đề có 2 phương án đúng: “Gồm 3 kết cục chính…” và “Viêm cấp có thể chuyển thành viêm mạn khi không loại trừ được tác nhân” (gần như nguyên văn giáo trình). App chọn phương án đầy đủ nhất; hỏi lại giảng viên đáp án chính thức."}, {"id": 39, "t": "th", "q": "Tế bào thấm nhập chủ yếu trong quá trình viêm mạn gồm?", "a": "Đại thực bào, lympho bào, tương bào, bạch cầu ái toan", "d": ["Đại thực bào, tương bào, bạch cầu ái toan, bạch cầu đa nhân", "Đại thực bào, lympho bào, bạch cầu đơn nhân, bạch cầu đa nhân", "Đại thực bào, bạch cầu đa nhân, lympho bào, bạch cầu ái toan"], "e": "Viêm mạn: macrophage, lymphocyte, plasma cell ± eosinophil. Neutrophil không phải chủ yếu."}, {"id": 40, "t": "th", "q": "Viêm hạt là gì?", "a": "Là một dạng của viêm mạn", "d": ["Là một dạng của viêm cấp", "Là một dạng viêm cấp trên nền viêm mạn", "Là một dạng viêm bình thường"], "e": "Granulomatous inflammation = dạng đặc biệt của viêm mạn."}, {"id": 41, "t": "th", "q": "So sánh viêm cấp và viêm mạn, phát biểu nào sau đây không đúng", "a": "Viêm mạn có sự thấm nhập của bạch cầu đa nhân trung tính, tương bào và bạch cầu ái toan", "d": ["Viêm cấp có thời gian diễn tiến ngắn, thường là vài giờ hoặc vài phút", "Viêm mạn gây tổn thương mô thường nặng và diễn tiến", "Triệu chứng tại chỗ và toàn thân thường nổi bật trong viêm cấp"], "e": "Viêm mạn: đại thực bào + lympho + tương bào (± bạch cầu ái toan). Bạch cầu đa nhân trung tính là đặc trưng của viêm cấp. Lưu ý: phương án “vài giờ hoặc vài phút” cũng chưa chuẩn (giáo trình: viêm cấp diễn tiến từ vài giờ đến vài ngày), nhưng lỗi rõ nhất là bạch cầu đa nhân trong viêm mạn."}, {"id": 42, "t": "th", "q": "Sự hình thành sẹo lồi trong quá trình sửa chữa bằng hình thức hóa sẹo là do hoạt động quá mức của các:", "a": "Nguyên bào sợi", "d": ["Nguyên bào sợi – cơ", "Tế bào cơ vân", "Tế bào cơ trơn"], "e": "Giáo trình GPB (PNT): tổng hợp quá đáng sợi collagen → sẹo lồi (keloid); nguyên bào sợi – cơ hoạt động quá mức → sẹo co kéo. Collagen do nguyên bào sợi tổng hợp → sẹo lồi do nguyên bào sợi hoạt động quá mức (Robbins mô tả tương tự)."}, {"id": 43, "t": "th", "q": "(Câu bonus) Một tháng sau mổ ruột thừa, bệnh nhân thấy nổi lên ngay dưới sẹo mổ 1 nốt nhỏ mà cấu tạo vi thể gồm các sợi collagen, đại thực bào, đại bào nhiều nhân và một ít lympho bào; thường là do biến chứng:", "a": "Viêm hạt do dị vật", "d": ["Viêm cấp tính", "Viêm lao", "Viêm mủ"], "e": "Sẹo mổ + giant cell + macrophage → foreign body granuloma (chỉ khâu, talc…)."}, {"id": 44, "t": "u", "q": "Carcinoma là thuật ngữ cho loại U nào sau đây", "a": "Khối U ác tính có nguồn gốc từ biểu mô", "d": ["Khối U ác có nguồn gốc từ biểu mô và mô liên kết", "Khối U ác tính có nguồn gốc từ trung mô", "Khối U ác tính có nguồn gốc từ lympho bào"], "e": "Carcinoma = malignant epithelial tumor. Sarcoma = mesenchymal."}, {"id": 45, "t": "u", "q": "Lipoma là tên gọi của U lành xuất phát từ", "a": "Tế bào mỡ", "d": ["Tế bào cơ vân", "Tế bào cơ trơn", "Tế bào lympho"], "e": "Lipoma = benign tumor of adipocytes."}, {"id": 46, "t": "u", "q": "Phình giáp là dạng tổn thương giả U nào", "a": "Biến đổi do rối loạn nội tiết", "d": ["Nang ứ đọng", "Nang bẩm sinh", "U hạt viêm"], "e": "Goiter = hyperplasia do rối loạn hormone giáp, thuộc tổn thương giả u."}, {"id": 47, "t": "u", "q": "Đâu là tên gọi của U ác tính", "a": "Lymphoma", "d": ["Fibroma", "Chondroma", "Cystadenoma"], "e": "Lymphoma là ác tính. Các đuôi -oma còn lại thường lành (trừ melanoma, lymphoma…)."}, {"id": 48, "t": "u", "q": "Melanoma là U gì", "a": "U tế bào hắc tố ác tính", "d": ["U của biểu mô tuyến lành tính", "U của biểu mô lành tính", "U tế bào sắc tố lành tính"], "e": "Melanoma = malignant melanocytic tumor."}, {"id": 49, "t": "u", "q": "Sarcoma KHÔNG có đặc điểm", "a": "Tiên lượng thường tốt", "d": ["Là u ác", "Khó phân biệt giữa mô chủ và mô đệm", "Nguồn gốc từ trung mô và mô liên kết"], "e": "Sarcoma là u ác của trung mô/mô liên kết, thường lớn nhanh và di căn sớm theo đường máu → tiên lượng thường xấu, không phải “tốt”."}, {"id": 50, "t": "u", "q": "Dạng đại thể của U lành xuất phát từ biểu mô phủ ít khi có dạng", "a": "Loét", "d": ["Gồ lên bề mặt", "Polyp", "Nhú"], "e": "U lành biểu mô phủ thường gồ, polyp, nhú. Loét gợi ý ác tính."}, {"id": 51, "t": "u", "q": "Đặc trưng vi thể của u lành là", "a": "Tế bào u tăng sản giống mô bình thường, biệt hoá tế bào và mô hoàn toàn, không xâm nhập các mô xung quanh.", "d": ["Tế bào u tăng sản giống mô bình thường, biệt hoá tế bào và mô cao, không xâm nhập các mô xung quanh.", "Tế bào u tăng sản giống mô bình thường, biệt hoá tế bào và mô vừa, xâm nhập các mô xung quanh.", "Tế bào u tăng sản giống mô bình thường, biệt hoá tế bào và mô kém, không xâm nhập các mô xung quanh."], "e": "Giáo trình Bệnh lý u: cấu tạo vi thể của u lành giống hệt mô nguyên ủy; tế bào u đạt độ biệt hoá HOÀN TOÀN về cấu trúc và chức năng, không xâm nhập mô xung quanh. (Robbins gọi là “well-differentiated”, nhưng đề bám đúng chữ giáo trình.)"}, {"id": 52, "t": "u", "q": "So với khối U ác thì U lành có đặc điểm", "a": "Nhân đồng dạng", "d": ["Chất nhiễm sắc thô, tăng sắc", "Tỷ lệ nhân: tế bào chất tăng", "Thay đổi và hình dạng kích thước nhân."], "e": "U lành: nhân đồng dạng, ít atypia. U ác: pleomorphism, hyperchromasia, ↑N/C."}, {"id": 53, "t": "u", "q": "Thời gian nhân đôi (TGNĐ) là", "a": "Là thời gian cần thiết để đường kính khối U tăng gấp đôi", "d": ["TGNĐ càng dài thì thời kỳ tiền lâm sàng càng ngắn ra", "TGNĐ càng ngắn thì thời kỳ tiền lâm sàng càng dài ra", "TGNĐ giống nhau cho mỗi loại ung thư"], "e": "Giáo trình: TGNĐ là thời gian cần thiết để SỐ LƯỢNG tế bào u tăng gấp đôi. Chữ “đường kính” trong đề chưa chuẩn (đường kính gấp đôi ≈ thể tích tăng 8 lần), nhưng 3 phương án còn lại đều sai: TGNĐ càng ngắn thì thời kỳ tiền lâm sàng càng ngắn, và TGNĐ khác nhau tùy loại ung thư (vd. lymphôm Burkitt ~3 ngày). Nếu đề ghi “số lượng tế bào/thể tích” thì chọn phương án đó."}, {"id": 54, "t": "u", "q": "Sự di căn đường mạch bạch trước tiên thường thấy", "a": "Carcinoma", "d": ["Sarcoma", "Adenoma", "Lipoma"], "e": "Carcinoma thường di căn bạch huyết trước; sarcoma thường đường máu."}, {"id": 55, "t": "u", "q": "Xếp giai đoạn ung thư (TNM) Tx được hiểu là", "a": "U nguyên phát không thể đánh giá được", "d": ["Không tìm thấy u nguyên phát", "Carcinôm tại chỗ", "Kích thước u"], "e": "Tx = Primary tumor cannot be assessed. T0 = no evidence of primary."}, {"id": 56, "t": "u", "q": "Giai đoạn III ung thư được hiểu là", "a": "Lan rộng và di căn đến nhiều hạch", "d": ["Xâm nhập tại chỗ còn sớm, không có di căn", "Bắt đầu lan rộng và di căn đến hạch vùng", "Có di căn xa"], "e": "Giai đoạn III thường = lan rộng tại chỗ + nhiều hạch vùng. IV = di căn xa. (Tùy từng loại u)."}, {"id": 57, "t": "u", "q": "Ung thư lan rộng và di căn đến nhiều hạch là giai đoạn nào?", "a": "III", "d": ["II", "IV", "I"], "e": "Nhiều hạch vùng → thường stage III."}, {"id": 58, "t": "u", "q": "Sự di căn đường mạch máu trước tiên thường thấy", "a": "Sarcoma", "d": ["Carcinoma", "Adenoma", "Fibroma"], "e": "Sarcoma ưu tiên di căn đường máu."}, {"id": 59, "t": "u", "q": "Trong viêm tuyến nước bọt do virus quai bị (paramyxovirus), biến chứng nào sau đây cần đặc biệt lưu ý ở bệnh nhân nam trưởng thành để phòng ngừa hệ quả lâu dài?", "a": "Viêm tinh hoàn dẫn đến vô sinh.", "d": ["Xơ hóa và teo các tiểu thùy tuyến.", "Hoại tử hóa mủ tạo thành áp xe.", "Sưng to toàn bộ các tuyến nước bọt phụ."], "e": "Quai bị ở nam trưởng thành: orchitis → nguy cơ vô sinh."}, {"id": 60, "t": "u", "q": "Dựa trên phân loại mô bệnh học, loại u nào chiếm tỷ lệ cao nhất (khoảng 50%) trong số các u lành tính và ác tính của tuyến nước bọt?", "a": "U tuyến đa dạng (Pleomorphic adenoma)", "d": ["Carcinôm nhầy bì (Mucoepidermoid carcinoma)", "U Warthin (Warthin tumor)", "U tuyến tế bào đáy (Basal cell adenoma)"], "e": "Pleomorphic adenoma là u tuyến nước bọt phổ biến nhất (~50%)."}, {"id": 61, "t": "u", "q": "Một bệnh nhân xuất hiện mảng trắng ở niêm mạc má. Sau khi dùng gạc cạo thử, mảng trắng bong ra để lộ nền mô viêm đỏ phía dưới. Chẩn đoán lâm sàng hướng tới bệnh lý nào?", "a": "Nhiễm nấm Candida (Candidiasis)", "d": ["Lichen phẳng (Lichen planus)", "Bạch sản dạng lông (OHL) do EBV", "Bạch sản (Leukoplakia)"], "e": "Mảng trắng cạo được + nền đỏ = pseudomembranous candidiasis."}, {"id": 62, "t": "u", "q": "Tại sao u tuyến đa dạng (Pleomorphic adenoma) thường có tỷ lệ tái phát cao và đôi khi chuyển ác tính (2−3%), mặc dù nó là u lành tính?", "a": "Do vỏ bao sợi không hoàn toàn, dễ sót tế bào u khi phẫu thuật.", "d": ["Do u có nguồn gốc từ tế bào lympho trong tuyến mang tai.", "Do u luôn xâm nhiễm trực tiếp vào dây thần kinh mặt.", "Do u chứa thành phần sụn và xương gây kích ứng mô xung quanh."], "e": "Pseudocapsule không hoàn toàn → dễ sót mô u → tái phát; một số case chuyển malignant."}, {"id": 63, "t": "u", "q": "Trong chẩn đoán Ung thư biểu mô tế bào gai (OSCC) tại khoang miệng, dấu hiệu lâm sàng nào được coi là 'cảnh báo' quan trọng nhất để nghĩ đến ác tính?", "a": "Vết loét không lành kéo dài trên 2 tuần kèm thâm nhiễm cứng.", "d": ["Sự xuất hiện của các mảng đỏ có giới hạn rõ ranh giới.", "Các bóng nước nhỏ mọc thành chùm kèm đau rát.", "Mảng trắng mềm mại xuất hiện ở nếp lợi má."], "e": "Non-healing ulcer >2 weeks + induration là red-flag cho OSCC."}, {"id": 64, "t": "u", "q": "Đặc điểm vi thể nào sau đây giúp phân biệt U Warthin với các loại u khác của tuyến nước bọt?", "a": "Lớp biểu mô 2 tầng tế bào ái toan lót khoang và mô lympho phát triển phía dưới.", "d": ["Đám tế bào hình thoi sắp xếp xen kẽ với đảo dạng sụn.", "Thấm nhập tế bào đơn nhân lan tỏa kèm các ổ hoại tử mô kẽ.", "Sự hiện diện của các tế bào tiết nhầy và tế bào gai xâm nhập mô đệm."], "e": "Warthin tumor = bilayered oncocytic epithelium + lymphoid stroma."}, {"id": 65, "t": "u", "q": "Theo nguyên tắc tiếp cận tổn thương khoang miệng, khi nào việc sinh thiết được coi là bắt buộc?", "a": "Khi tổn thương dai dẳng kéo dài trên 2 tuần.", "d": ["Khi tổn thương xuất hiện dưới dạng bóng nước d < 5mm.", "Khi bệnh nhân có cảm giác đau rát khi ăn thức ăn cay nóng.", "Ngay khi phát hiện mảng trắng ở người có hút thuốc lá."], "e": "Tổn thương miệng kéo dài >2 tuần cần sinh thiết để loại trừ ác tính."}, {"id": 66, "t": "u", "q": "Tổn thương nào sau đây có 'tiềm năng hóa ác' cao nhất (khoảng 40%) trong các tổn thương tiền ung thư khoang miệng?", "a": "Hồng sản (Erythroplakia)", "d": ["U nhú gai (Papilloma)", "Viêm loét miệng Áp-tơ", "Bạch sản (Leukoplakia)"], "e": "Erythroplakia có nguy cơ hóa ác rất cao (~40% hoặc hơn), cao hơn leukoplakia."}, {"id": 67, "t": "u", "q": "Hội chứng Sjögren gây ra tình trạng khô miệng và khô mắt do cơ chế nào?", "a": "Hệ miễn dịch tấn công và phá hủy các tuyến nước bọt và tuyến lệ.", "d": ["Phản ứng dị ứng với các thành phần trong thực phẩm và thuốc.", "Nhiễm virus mạn tính làm teo các tiểu thùy tuyến.", "Sự hình thành sỏi gây tắc nghẽn hoàn toàn ống dẫn tuyến."], "e": "Sjögren = autoimmune destruction of salivary & lacrimal glands."}, {"id": 68, "t": "u", "q": "Trong hình thái vi thể của Ung thư biểu mô tế bào gai (OSCC), cấu trúc nào sau đây cho thấy mức độ biệt hóa của u?", "a": "Cầu sừng (Keratin pearls)", "d": ["Các tế bào tiết nhầy nằm rải rác.", "Đám tế bào đơn nhân thấm nhập mô kẽ.", "Sự hiện diện của các thể vùi trong nhân tế bào."], "e": "Keratin pearl = dấu hiệu biệt hóa cao của squamous cell carcinoma."}, {"id": 69, "t": "u", "q": "Loại niêm mạc nào sau đây lót ở môi, má và sàn miệng với đặc điểm không sừng hóa?", "a": "Niêm mạc lót (Lining mucosa)", "d": ["Niêm mạc chuyên biệt (Specialized mucosa)", "Niêm mạc nhai (Masticatory mucosa)", "Màng đáy (Basement membrane)"], "e": "Lining mucosa (môi, má, sàn miệng, mặt dưới lưỡi) = non-keratinized."}, {"id": 70, "t": "u", "q": "U hạt tế bào khổng lồ ngoại vi (Peripheral giant cell granuloma) thường xuất hiện ở vị trí nào và do nguyên nhân gì?", "a": "Ở nướu răng, do phản ứng với kích thích hoặc chấn thương tại chỗ.", "d": ["Ở mặt lưng lưỡi, do thiếu hụt vitamin và sắt.", "Ở tuyến mang tai, do tắc nghẽn ống dẫn nước bọt.", "Ở sàn miệng, do nhiễm virus HPV lâu ngày."], "e": "PGCG: nướu, phản ứng với kích thích/chấn thương tại chỗ."}, {"id": 71, "t": "u", "q": "Đặc điểm lâm sàng nào giúp phân biệt nhiễm Herpes (HSV-1) với loét Áp-tơ thông thường?", "a": "Herpes khởi đầu bằng các bóng nước nhỏ, Áp-tơ thì không.", "d": ["Áp-tơ chỉ xuất hiện ở người già, Herpes ở trẻ em.", "Herpes không bao giờ tái phát, Áp-tơ thì có.", "Loét Áp-tơ luôn đi kèm với sốt cao và lạnh run."], "e": "HSV: bắt đầu bằng vesicle. Aphthous ulcer: không qua giai đoạn bóng nước."}, {"id": 72, "t": "u", "q": "Sự khác biệt chính giữa mảng trắng do nhiễm nấm Candida và bệnh Bạch sản (Leukoplakia) khi thăm khám lâm sàng là gì?", "a": "Mảng trắng do nấm có thể cạo tróc được, lộ nền đỏ; bạch sản thì không", "d": ["Chỉ có bạch sản mới xuất hiện ở người hút thuốc lá", "Nhiễm nấm chỉ gặp ở trẻ em, bạch sản chỉ gặp ở người già", "Bạch sản luôn gây đau dữ dội còn nấm thì không"], "e": "Candida (pseudomembranous) cạo được; leukoplakia không cạo được."}, {"id": 73, "t": "u", "q": "Loại u răng (Odontoma) nào có các mô răng phát triển thành nhiều cấu trúc nhỏ trông giống như những chiếc răng bình thường?", "a": "U răng hỗn hợp (Compound odontoma)", "d": ["U nguyên bào men (Ameloblastoma)", "U răng phức hợp (Complex odontoma)", "U nhú gai (Papilloma)"], "e": "U răng hỗn hợp (compound odontoma): mô răng tạo thành nhiều cấu trúc nhỏ giống răng. U răng phức hợp (complex odontoma): khối mô răng sắp xếp lộn xộn, không tạo hình răng."}, {"id": 74, "t": "u", "q": "Dựa trên các yếu tố nguy cơ của Ung thư khoang miệng (OSCC), hành vi nào sau đây làm tăng đáng kể nguy cơ mắc bệnh?", "a": "Hút thuốc lá, uống rượu và nhiễm virus HPV", "d": ["Sử dụng chỉ nha khoa thường xuyên", "Đánh răng 2 lần mỗi ngày", "Uống nhiều nước lọc hàng ngày"], "e": "Rủi ro chính OSCC: thuốc lá, rượu, HPV (đặc biệt type 16)."}, {"id": 75, "t": "u", "q": "Đặc điểm vi thể điển hình của U nguyên bào men (Ameloblastoma) là sự xuất hiện của các tế bào ở trung tâm đảo biểu mô trông giống cấu trúc nào sau đây?", "a": "Tế bào dạng lưới hình sao (Stellate reticulum-like cells)", "d": ["Tế bào khổng lồ đa nhân (Multinucleated giant cells)", "Cầu sừng (Keratin pearl)", "Sợi nấm và bào tử nấm"], "e": "Ameloblastoma: peripheral palisading + central stellate reticulum-like cells."}];

<script>
"use strict";
// ---------- tiện ích ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
const QMAP = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
const LETTERS = ["A","B","C","D"];
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1800); }
// Tạo 4 lựa chọn đã đảo ngẫu nhiên; trả về {opts:[text], correct:index}
const PIN = /^(Cả 3|Cả ba|Tất cả đều)/i;
function makeOptions(q){ const all=[q.a, ...q.d]; const opts = shuffle(all.filter(o=>!PIN.test(o))).concat(all.filter(o=>PIN.test(o))); return { opts, correct: opts.indexOf(q.a) }; }

// ---------- lưu trữ ----------
const KEY = "giai_phau_benh_v1";
let S;
function blank(){ return { q:{}, exams:[], v:1 }; }
function load(){ try { S = JSON.parse(localStorage.getItem(KEY)) || blank(); } catch(e){ S = blank(); } if(!S.q) S.q={}; if(!S.exams) S.exams=[]; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function st(id){ return S.q[id] || (S.q[id] = { n:0, c:0, w:0, wa:false, card:null, last:null }); }
// ghi nhận 1 lần trả lời (luyện tập / thi / ôn câu sai)
function record(id, ok){
  const s = st(id); s.n++; s.last = ok ? 1 : 0;
  if (ok) { s.c++; s.wa = false; } else { s.w++; s.wa = true; }
  save();
}
load();

// ---------- tính thống kê ----------
function stats(){
  let done=0, c=0, n=0, wrongActive=0, unknown=0, known=0;
  const byT = {};
  for (const k in TOPICS) byT[k] = { total:0, done:0, c:0, n:0 };
  for (const q of QUESTIONS){
    const s = S.q[q.id]; const t = byT[q.t]; t.total++;
    if (!s) continue;
    if (s.n > 0 || s.card) { done++; t.done++; }
    c += s.c; n += s.n; t.c += s.c; t.n += s.n;
    if (s.wa) wrongActive++;
    if (s.card === "u") unknown++; if (s.card === "k") known++;
  }
  return { done, c, n, acc: pct(c,n), wrongActive, unknown, known, byT };
}

// ---------- điều hướng ----------
const ICONS = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>',
  prac:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>',
  exam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>',
  card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 2h12a2 2 0 0 1 2 2v12"/></svg>',
  wrong:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>'
};
const TABS = [["home","Tổng quan"],["prac","Luyện tập"],["exam","Thi thử"],["card","Flashcard"],["wrong","Câu sai"]];
let view = "home";
let examTimer = null;
function go(v){
  if (view === "exam" && E && E.running && v !== "exam") { if(!confirm("Bạn đang làm bài thi. Rời đi sẽ huỷ bài thi này?")) return; stopExam(); E=null; }
  view = v; renderTabs(); render(); window.scrollTo(0,0);
}
function renderTabs(){
  $("#tabs").innerHTML = TABS.map(([k,l]) => {
    let badge = "";
    if (k==="wrong"){ const n = stats().wrongActive; if(n) badge = ` (${n})`; }
    return `<button class="${view===k?'on':''}" onclick="go('${k}')" aria-label="${l}">${ICONS[k]}<span>${l}${badge}</span></button>`;
  }).join("");
}
function render(){
  const f = { home:renderHome, prac:renderPrac, exam:renderExam, card:renderCard, wrong:renderWrong }[view];
  $("#app").innerHTML = f(); if (f.after) f.after();
}
function topicChips(sel, fn){
  return `<div class="chips"><button class="chip ${sel==='all'?'on':''}" onclick="${fn}('all')">Tất cả</button>` +
    Object.entries(TOPICS).map(([k,v]) => `<button class="chip ${sel===k?'on':''}" onclick="${fn}('${k}')">${esc(v.split(" (")[0])}</button>`).join("") + `</div>`;
}
function topicName(t){ return TOPICS[t]; }

// ================= TỔNG QUAN =================
function renderHome(){
  const s = stats(); const total = QUESTIONS.length;
  const weak = Object.entries(s.byT).filter(([,t]) => t.n >= 3).map(([k,t]) => ({ k, acc: pct(t.c,t.n), n:t.n })).sort((a,b) => a.acc-b.acc).slice(0,3);
  const flagged = QUESTIONS.filter(q => q.f);
  return `
  <h2>Tổng quan</h2>
  <div class="card">
    <div class="sec-title"><b>Tiến độ học tập</b><span class="muted">${s.done}/${total} câu</span></div>
    <div class="bar" style="margin-top:10px"><i style="width:${pct(s.done,total)}%"></i></div>
  </div>
  <div class="grid g4" style="margin-top:12px">
    <div class="stat"><b>${total}</b><span>Tổng số câu</span></div>
    <div class="stat"><b>${s.done}</b><span>Đã học</span></div>
    <div class="stat"><b>${s.acc}%</b><span>Tỷ lệ đúng (${s.c}/${s.n} lượt)</span></div>
    <div class="stat"><b style="color:var(--bad)">${s.wrongActive}</b><span>Câu sai cần ôn</span></div>
    <div class="stat"><b style="color:var(--ok)">${s.known}</b><span>Thẻ đã nhớ</span></div>
    <div class="stat"><b style="color:var(--warn)">${s.unknown}</b><span>Thẻ chưa nhớ</span></div>
    <div class="stat"><b>${S.exams.length}</b><span>Lần thi thử</span></div>
    <div class="stat"><b>${S.exams.length ? Math.max(...S.exams.map(e=>e.score)).toFixed(1) : "–"}</b><span>Điểm thi cao nhất</span></div>
  </div>

  <h3>Theo chủ đề</h3>
  <div class="card">
  ${Object.entries(s.byT).map(([k,t]) => `
    <div class="topicrow">
      <div class="lab"><span>${esc(TOPICS[k])}</span><span class="muted">${t.done}/${t.total}${t.n?` · ${pct(t.c,t.n)}% đúng`:''}</span></div>
      <div class="bar"><i style="width:${pct(t.done,t.total)}%"></i></div>
    </div>`).join("")}
  </div>

  <h3>Chủ đề yếu nhất</h3>
  <div class="card">${weak.length ? weak.map(w => `<div class="list"><div class="it"><span class="q">${esc(TOPICS[w.k])}</span><span class="pill ${w.acc<70?'bad':'ok'}">${w.acc}% đúng</span></div></div>`).join("") + `<div class="row" style="margin-top:10px"><button class="btn soft" onclick="P.topic='${weak[0].k}';P.list=null;go('prac')">Luyện chủ đề yếu nhất</button></div>` : `<div class="muted">Chưa đủ dữ liệu — hãy trả lời ít nhất 3 câu mỗi chủ đề.</div>`}</div>

  <h3>Lịch sử thi thử</h3>
  <div class="card">${S.exams.length ? `<table class="h"><tr><th>Ngày</th><th>Số câu</th><th>Điểm /10</th><th>Đúng</th><th>Thời gian</th></tr>${S.exams.slice().reverse().slice(0,15).map(e=>`<tr><td>${new Date(e.date).toLocaleString("vi-VN",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</td><td>${e.total}${e.src==='wrong'?' (câu sai)':''}</td><td><b>${e.score.toFixed(1)}</b></td><td>${e.correct}/${e.total}</td><td>${fmtTime(e.used)}</td></tr>`).join("")}</table>` : `<div class="muted">Chưa có bài thi nào.</div>`}</div>

  ${flagged.length ? `<h3>Câu cần kiểm tra lại</h3><div class="card"><div class="muted" style="font-size:14px;margin-bottom:6px">Những câu dưới đây có đáp án dễ tranh luận hoặc đã được chỉnh sửa — nên đối chiếu với slide/giảng viên.</div><div class="list">${flagged.map(q=>`<div class="it"><span class="q"><b>Câu ${q.id}:</b> ${esc(q.f)}</span></div>`).join("")}</div></div>` : ""}

  <h3>Dữ liệu</h3>
  <div class="card">
    <div class="row">
      <button class="btn ghost" onclick="exportCSV()">Xuất kết quả (CSV)</button>
      <button class="btn ghost" onclick="exportJSON()">Sao lưu (JSON)</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost" onclick="$('#imp').click()">Khôi phục từ file</button>
      <button class="btn danger" onclick="resetAll()">Xoá toàn bộ tiến độ</button>
    </div>
    <input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importJSON(this)">
    <div class="muted" style="font-size:13px;margin-top:10px">Tiến độ được lưu trên trình duyệt của thiết bị này (LocalStorage). Dùng “Sao lưu” để chuyển sang máy khác.</div>
  </div>`;
}
function fmtTime(s){ s = Math.max(0, Math.round(s||0)); const m = Math.floor(s/60), x = s%60; return `${m}:${String(x).padStart(2,"0")}`; }
function download(name, text, type){
  const blob = new Blob([text], { type }); const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportCSV(){
  const s = stats(); const q = v => `"${String(v).replace(/"/g,'""')}"`;
  let out = "﻿KẾT QUẢ ÔN TẬP GIẢI PHẪU BỆNH\nXuất lúc," + q(new Date().toLocaleString("vi-VN")) + "\n";
  out += `Đã học,${s.done}/${QUESTIONS.length}\nTỷ lệ đúng,${s.acc}%\nCâu sai cần ôn,${s.wrongActive}\n\n`;
  out += "Câu,Chủ đề,Câu hỏi,Đáp án đúng,Số lần làm,Số lần đúng,Số lần sai,Còn trong danh sách sai,Flashcard\n";
  for (const x of QUESTIONS){ const t = S.q[x.id] || {}; out += [x.id, q(TOPICS[x.t]), q(x.q), q(x.a), t.n||0, t.c||0, t.w||0, t.wa?"Có":"", t.card==="k"?"Đã nhớ":t.card==="u"?"Chưa nhớ":""].join(",") + "\n"; }
  out += "\nLỊCH SỬ THI THỬ\nNgày,Số câu,Điểm /10,Đúng,Sai,Bỏ trống,Thời gian\n";
  for (const e of S.exams) out += [q(new Date(e.date).toLocaleString("vi-VN")), e.total, e.score.toFixed(2), e.correct, e.wrong, e.blank, fmtTime(e.used)].join(",") + "\n";
  download("ket-qua-on-tap-GPB.csv", out, "text/csv;charset=utf-8"); toast("Đã xuất file CSV");
}
function exportJSON(){ download("sao-luu-GPB.json", JSON.stringify(S), "application/json"); toast("Đã tạo file sao lưu"); }
function importJSON(inp){
  const f = inp.files[0]; if (!f) return; const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d || typeof d.q!=="object" || !Array.isArray(d.exams)) throw 0; S = d; save(); render(); renderTabs(); toast("Đã khôi phục tiến độ"); } catch(e){ alert("File không hợp lệ."); } };
  r.readAsText(f);
}
function resetAll(){ if (!confirm("Xoá toàn bộ tiến độ, câu sai, flashcard và lịch sử thi?")) return; S = blank(); save(); P.list=null; F.queue=null; render(); renderTabs(); toast("Đã làm mới tiến độ"); }

// ================= LUYỆN TẬP =================
// P: trạng thái phiên luyện tập. list = mảng {id, o:{opts,correct}, pick:null|index}
const P = { topic:"all", order:"seq", list:null, i:0, src:"all" };
function buildPractice(){
  let ids = QUESTIONS.filter(q => P.topic==="all" || q.t===P.topic).map(q => q.id);
  if (P.order === "rand") ids = shuffle(ids);
  if (P.order === "new") ids = ids.filter(id => !(S.q[id] && S.q[id].n));
  P.list = ids.map(id => ({ id, o: makeOptions(QMAP[id]), pick: null })); P.i = 0;
}
function setPTopic(t){ P.topic = t; P.list = null; render(); }
function setPOrder(o){ P.order = o; P.list = null; render(); }
function renderPrac(){
  if (!P.list) buildPractice();
  const head = `<h2>Luyện tập</h2>
    ${topicChips(P.topic, "setPTopic")}
    <div class="chips" style="margin:10px 0 14px">
      <button class="chip ${P.order==='seq'?'on':''}" onclick="setPOrder('seq')">Theo thứ tự</button>
      <button class="chip ${P.order==='rand'?'on':''}" onclick="setPOrder('rand')">Ngẫu nhiên</button>
      <button class="chip ${P.order==='new'?'on':''}" onclick="setPOrder('new')">Chưa làm</button>
    </div>`;
  if (!P.list.length) return head + `<div class="card empty">Không còn câu nào trong mục này 🎉</div>`;
  return head + questionCard(P, "pracPick", "pracNav", false);
}
function questionCard(ctx, pickFn, navFn, wrongMode){
  const it = ctx.list[ctx.i]; const q = QMAP[it.id]; const answered = it.pick !== null;
  const s = S.q[q.id];
  const opts = it.o.opts.map((t, k) => {
    let cls = "";
    if (answered){ if (k === it.o.correct) cls = "right"; else if (k === it.pick) cls = "wrong"; }
    return `<button class="opt ${cls}" ${answered?"disabled":""} onclick="${pickFn}(${k})"><span class="k">${LETTERS[k]}</span><span>${esc(t)}</span></button>`;
  }).join("");
  let fb = "";
  if (answered){
    const ok = it.pick === it.o.correct;
    fb = `<div class="fb ${ok?'ok':'bad'}"><b class="t">${ok?"✓ Chính xác!":"✗ Chưa đúng"}</b>${ok?"":`Đáp án đúng: <b>${LETTERS[it.o.correct]}. ${esc(q.a)}</b><br>`}<span>${esc(q.e)} <span style="color:#e11d48;font-weight:600">HA iu Hoa</span></span></div>`;
    if (q.f) fb += `<div class="flag">⚠ <b>Cần kiểm tra:</b> ${esc(q.f)}</div>`;
  }
  const done = ctx.list.filter(x => x.pick !== null).length;
  return `<div class="card">
    <div class="qhead"><span>Câu ${ctx.i+1}/${ctx.list.length} · <b>#${q.id}</b></span><span>${s&&s.w?`<span class="pill bad">Sai ${s.w} lần</span>`:""}</span></div>
    <div class="bar"><i style="width:${pct(done,ctx.list.length)}%"></i></div>
    <div style="margin-top:12px"><span class="tag">${esc(topicName(q.t))}</span> ${q.f?'<span class="tag warn">⚠ Cần kiểm tra</span>':''}</div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="opts">${opts}</div>
    ${fb}
    <div class="nav3">
      <button class="btn ghost" ${ctx.i===0?"disabled":""} onclick="${navFn}(-1)">‹ Trước</button>
      <button class="btn soft" ${answered||ctx.i>=ctx.list.length-1?"disabled":""} onclick="${navFn}(1)">Bỏ qua</button>
      <button class="btn" ${ctx.i>=ctx.list.length-1?"disabled":""} onclick="${navFn}(1)">Tiếp ›</button>
    </div>
    <div class="muted" style="text-align:center;font-size:13px;margin-top:10px">Đã trả lời ${done}/${ctx.list.length} · Đúng ${ctx.list.filter(x=>x.pick!==null&&x.pick===x.o.correct).length}</div>
  </div>`;
}
function pracPick(k){ const it = P.list[P.i]; if (it.pick !== null) return; it.pick = k; record(it.id, k === it.o.correct); render(); renderTabs(); }
function pracNav(d){ P.i = Math.max(0, Math.min(P.list.length-1, P.i + d)); render(); window.scrollTo(0,0); }

// ================= THI THỬ =================
let E = null; // {list:[{id,o,pick}], i, total, dur, end, running, submitted, src}
const EX = { n:30, perQ:60, topic:"all" };
function renderExam(){
  if (E && E.submitted) return examResult();
  if (E && E.running) return examRun();
  const avail = QUESTIONS.filter(q => EX.topic==="all" || q.t===EX.topic).length;
  return `<h2>Thi thử</h2>
  <div class="card">
    <label class="f">Số câu</label>
    <div class="chips">${[20,30,50,QUESTIONS.length].map(n=>`<button class="chip ${EX.n===n?'on':''}" onclick="EX.n=${n};render()">${n===QUESTIONS.length?`Tất cả (${n})`:`${n} câu`}</button>`).join("")}</div>
    <label class="f">Thời gian mỗi câu</label>
    <div class="chips">${[[45,"45 giây"],[60,"1 phút"],[90,"1,5 phút"]].map(([v,l])=>`<button class="chip ${EX.perQ===v?'on':''}" onclick="EX.perQ=${v};render()">${l}</button>`).join("")}</div>
    <label class="f">Phạm vi</label>
    ${topicChips(EX.topic, "setExTopic")}
    <div class="muted" style="margin:14px 0;font-size:14.5px">Đề gồm <b>${Math.min(EX.n,avail)}</b> câu, thời gian <b>${fmtTime(Math.min(EX.n,avail)*EX.perQ)}</b>. Câu hỏi và đáp án được đảo ngẫu nhiên; không hiển thị đáp án khi đang thi; tự động nộp khi hết giờ.</div>
    <button class="btn block" onclick="startExam()">Bắt đầu thi</button>
  </div>`;
}
function setExTopic(t){ EX.topic = t; render(); }
function startExam(ids, src){
  if (!ids){ ids = shuffle(QUESTIONS.filter(q => EX.topic==="all" || q.t===EX.topic).map(q=>q.id)).slice(0, EX.n); }
  else ids = shuffle(ids);
  const total = ids.length; const dur = total * EX.perQ;
  E = { list: ids.map(id => ({ id, o: makeOptions(QMAP[id]), pick: null })), i:0, total, dur, start: Date.now(), end: Date.now() + dur*1000, running:true, submitted:false, src: src||"bank" };
  view = "exam"; renderTabs(); render(); window.scrollTo(0,0);
  stopExam(); examTimer = setInterval(tick, 500);
}
function stopExam(){ if (examTimer) { clearInterval(examTimer); examTimer = null; } }
function tick(){
  if (!E || !E.running) return stopExam();
  const left = Math.max(0, (E.end - Date.now())/1000);
  const el = $("#timer"); if (el){ el.textContent = "⏱ " + fmtTime(left); el.classList.toggle("low", left < 60); }
  if (left <= 0){ submitExam(true); }
}
function examRun(){
  const it = E.list[E.i]; const q = QMAP[it.id]; const left = Math.max(0, (E.end - Date.now())/1000);
  const answered = E.list.filter(x => x.pick !== null).length;
  return `<div class="sec-title" style="margin-bottom:10px"><h2 style="margin:0">Đang thi</h2><span id="timer" class="timer ${left<60?'low':''}">⏱ ${fmtTime(left)}</span></div>
  <div class="card">
    <div class="qhead"><span>Câu ${E.i+1}/${E.total}</span><span>Đã làm ${answered}/${E.total}</span></div>
    <div class="bar"><i style="width:${pct(answered,E.total)}%"></i></div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="opts">${it.o.opts.map((t,k)=>`<button class="opt ${it.pick===k?'sel':''}" onclick="examPick(${k})"><span class="k">${LETTERS[k]}</span><span>${esc(t)}</span></button>`).join("")}</div>
    <div class="nav3">
      <button class="btn ghost" ${E.i===0?"disabled":""} onclick="examNav(-1)">‹ Trước</button>
      <button class="btn soft" ${it.pick===null?"disabled":""} onclick="examPick(null)">Bỏ chọn</button>
      <button class="btn" ${E.i>=E.total-1?"disabled":""} onclick="examNav(1)">Tiếp ›</button>
    </div>
  </div>
  <div class="card"><div class="muted" style="font-size:13.5px;margin-bottom:8px">Chuyển nhanh đến câu</div>
    <div class="qgrid">${E.list.map((x,k)=>`<button class="${x.pick!==null?'ans':''} ${k===E.i?'cur':''}" onclick="examJump(${k})">${k+1}</button>`).join("")}</div>
    <button class="btn block" style="margin-top:14px" onclick="submitExam(false)">Nộp bài</button>
  </div>`;
}
function examPick(k){ E.list[E.i].pick = k; if (k !== null && E.i < E.total-1) { E.i++; } render(); }
function examNav(d){ E.i = Math.max(0, Math.min(E.total-1, E.i+d)); render(); window.scrollTo(0,0); }
function examJump(k){ E.i = k; render(); window.scrollTo(0,0); }
function submitExam(auto){
  if (!E || !E.running) return;
  if (!auto){ const blankN = E.list.filter(x=>x.pick===null).length; if (!confirm(blankN ? `Còn ${blankN} câu chưa làm. Nộp bài?` : "Nộp bài?")) return; }
  stopExam(); E.running = false; E.submitted = true;
  let c=0,w=0,b=0;
  for (const x of E.list){
    if (x.pick === null){ b++; const s = st(x.id); s.wa = true; s.last = 0; } // bỏ trống: đưa vào danh sách ôn, không tính lần sai
    else if (x.pick === x.o.correct){ c++; record(x.id, true); }
    else { w++; record(x.id, false); }
  }
  const used = Math.min(E.dur, (Date.now() - E.start)/1000);
  E.res = { c, w, b, score: c*10/E.total, used };
  S.exams.push({ date: Date.now(), total: E.total, correct:c, wrong:w, blank:b, score: c*10/E.total, used, src: E.src });
  save(); E.i = 0; E.rf = "all";
  if (auto) toast("Hết giờ — đã tự động nộp bài");
  view = "exam"; renderTabs(); render(); window.scrollTo(0,0);
}
function examResult(){
  const r = E.res;
  const list = E.list.map((x,k)=>({x,k})).filter(({x}) => E.rf==="all" || (E.rf==="w" && x.pick!==null && x.pick!==x.o.correct) || (E.rf==="b" && x.pick===null) || (E.rf==="r" && x.pick===x.o.correct));
  return `<h2>Kết quả thi thử</h2>
  <div class="card" style="text-align:center">
    <div class="score">${r.score.toFixed(1)}<span style="font-size:20px;color:var(--muted)">/10</span></div>
    <div class="muted" style="margin-top:6px">Tỷ lệ đúng ${pct(r.c,E.total)}% · Thời gian ${fmtTime(r.used)}</div>
    <div class="grid g4" style="margin-top:14px;grid-template-columns:repeat(3,1fr)">
      <div class="stat"><b style="color:var(--ok)">${r.c}</b><span>Đúng</span></div>
      <div class="stat"><b style="color:var(--bad)">${r.w}</b><span>Sai</span></div>
      <div class="stat"><b style="color:var(--muted)">${r.b}</b><span>Bỏ trống</span></div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn ghost" onclick="E=null;render()">Làm đề mới</button>
      ${r.w+r.b ? `<button class="btn" onclick="go('wrong')">Ôn câu sai</button>` : ""}
    </div>
  </div>
  <h3>Xem lại bài làm</h3>
  <div class="chips" style="margin-bottom:10px">${[["all","Tất cả"],["w","Sai"],["b","Bỏ trống"],["r","Đúng"]].map(([k,l])=>`<button class="chip ${E.rf===k?'on':''}" onclick="E.rf='${k}';render()">${l}</button>`).join("")}</div>
  ${list.length ? list.map(({x,k}) => reviewItem(x,k)).join("") : `<div class="card empty">Không có câu nào.</div>`}`;
}
function reviewItem(x, k){
  const q = QMAP[x.id]; const st_ = x.pick===null ? "b" : x.pick===x.o.correct ? "r" : "w";
  return `<div class="card">
    <div class="qhead"><span>Câu ${k+1} · #${q.id}</span><span class="pill ${st_==='r'?'ok':'bad'}">${st_==='r'?'Đúng':st_==='w'?'Sai':'Bỏ trống'}</span></div>
    <div class="qtext" style="font-size:16px;margin-top:4px">${esc(q.q)}</div>
    <div class="opts">${x.o.opts.map((t,j)=>`<div class="opt ${j===x.o.correct?'right':(j===x.pick?'wrong':'')}"><span class="k">${LETTERS[j]}</span><span>${esc(t)}</span></div>`).join("")}</div>
    <div class="fb ${st_==='r'?'ok':'bad'}">${esc(q.e)} <span style="color:#e11d48;font-weight:600">HA iu Hoa</span></div>
    ${q.f?`<div class="flag">⚠ <b>Cần kiểm tra:</b> ${esc(q.f)}</div>`:""}
  </div>`;
}

// ================= FLASHCARD =================
const F = { topic:"all", queue:null, i:0, flip:false, mode:"smart" };
function buildCards(){
  let qs = QUESTIONS.filter(q => F.topic==="all" || q.t===F.topic);
  const rank = q => { const c = (S.q[q.id]||{}).card; return c==="u" ? 0 : c==null ? 1 : 2; };
  if (F.mode === "smart") qs = shuffle(qs).sort((a,b) => rank(a)-rank(b));   // chưa nhớ → chưa học → đã nhớ
  else if (F.mode === "unknown") qs = shuffle(qs.filter(q => (S.q[q.id]||{}).card==="u"));
  else qs = qs.slice();
  F.queue = qs.map(q => q.id); F.i = 0; F.flip = false;
}
function setFTopic(t){ F.topic = t; F.queue = null; render(); }
function setFMode(m){ F.mode = m; F.queue = null; render(); }
function renderCard(){
  if (!F.queue) buildCards();
  const s = stats();
  const head = `<h2>Flashcard</h2>${topicChips(F.topic,"setFTopic")}
  <div class="chips" style="margin:10px 0 14px">
    <button class="chip ${F.mode==='smart'?'on':''}" onclick="setFMode('smart')">Ưu tiên chưa nhớ</button>
    <button class="chip ${F.mode==='unknown'?'on':''}" onclick="setFMode('unknown')">Chỉ thẻ chưa nhớ (${s.unknown})</button>
    <button class="chip ${F.mode==='seq'?'on':''}" onclick="setFMode('seq')">Theo thứ tự</button>
  </div>`;
  if (!F.queue.length) return head + `<div class="card empty">Không có thẻ nào trong mục này.</div>`;
  if (F.i >= F.queue.length) return head + `<div class="card empty"><div style="font-size:36px">🎉</div><b>Hoàn thành lượt ôn!</b><div style="margin:6px 0 14px">Đã nhớ ${s.known} · Chưa nhớ ${s.unknown}</div><button class="btn" onclick="F.queue=null;render()">Ôn lượt mới</button></div>`;
  const q = QMAP[F.queue[F.i]]; const c = (S.q[q.id]||{}).card;
  return head + `
  <div class="qhead"><span>Thẻ ${F.i+1}/${F.queue.length} · #${q.id}</span><span>${c==="k"?'<span class="pill ok">Đã nhớ</span>':c==="u"?'<span class="pill bad">Chưa nhớ</span>':''}</span></div>
  <div class="bar" style="margin-bottom:12px"><i style="width:${pct(F.i,F.queue.length)}%"></i></div>
  <div class="fc-wrap"><div class="fc ${F.flip?'flip':''}" id="fc" onclick="flipCard()">
    <div class="face front"><div class="lbl">Câu hỏi · ${esc(TOPICS[q.t].split(" (")[0])}</div><div class="q">${esc(q.q)}</div><div class="hint">Chạm để lật thẻ</div></div>
    <div class="face back"><div class="lbl">Đáp án</div><div class="ans">${esc(q.a)}</div><div style="font-size:15.5px">${esc(q.e)} <span style="color:#e11d48;font-weight:600">HA iu Hoa</span></div>${q.f?`<div class="flag">⚠ ${esc(q.f)}</div>`:""}</div>
  </div></div>
  <div class="row" style="margin-top:14px">
    <button class="btn bad" onclick="rateCard('u')">✗ Chưa nhớ</button>
    <button class="btn ok" onclick="rateCard('k')">✓ Đã nhớ</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="btn ghost" ${F.i===0?"disabled":""} onclick="F.i--;F.flip=false;render()">‹ Thẻ trước</button>
    <button class="btn ghost" onclick="flipCard()">Lật thẻ</button>
  </div>`;
}
renderCard.after = () => {
  // điều chỉnh chiều cao thẻ theo mặt dài hơn
  const fc = $("#fc"); if (!fc) return; let h = 340;
  fc.querySelectorAll(".face").forEach(f => { f.style.position="relative"; h = Math.max(h, f.scrollHeight); f.style.position=""; });
  fc.style.minHeight = h + "px";
};
function flipCard(){ F.flip = !F.flip; const fc = $("#fc"); if (fc) fc.classList.toggle("flip", F.flip); }
function rateCard(v){
  const id = F.queue[F.i]; st(id).card = v; save();
  if (v === "u" && F.mode !== "seq"){ // đưa thẻ chưa nhớ quay lại cuối hàng (sau ~4 thẻ) để ôn lại
    const pos = Math.min(F.queue.length, F.i + 5); F.queue.splice(pos, 0, id);
  }
  F.i++; F.flip = false; render(); renderTabs();
}

// ================= ÔN CÂU SAI =================
const W = { list:null, i:0, running:false };
function wrongIds(){ return QUESTIONS.filter(q => (S.q[q.id]||{}).wa).map(q => q.id); }
function renderWrong(){
  if (W.running) return renderWrongRun();
  const ids = wrongIds();
  const hist = QUESTIONS.filter(q => (S.q[q.id]||{}).w > 0).sort((a,b)=> S.q[b.id].w - S.q[a.id].w);
  return `<h2>Ôn tập câu sai</h2>
  <div class="card">
    <div class="grid g2">
      <div class="stat"><b style="color:var(--bad)">${ids.length}</b><span>Câu đang sai</span></div>
      <div class="stat"><b>${hist.length}</b><span>Câu từng sai</span></div>
    </div>
    <div class="muted" style="font-size:14px;margin:12px 0">Câu trả lời sai (và câu bỏ trống khi thi) được tự động lưu. Làm lại đến khi trả lời đúng thì câu sẽ rời khỏi danh sách; số lần sai vẫn được ghi nhận.</div>
    <div class="row">
      <button class="btn" ${ids.length?"":"disabled"} onclick="startWrong()">Làm lại câu sai</button>
      <button class="btn ghost" ${ids.length?"":"disabled"} onclick="startExam(wrongIds(),'wrong')">Tạo đề thi từ câu sai</button>
    </div>
  </div>
  <h3>Theo dõi số lần sai</h3>
  <div class="card">${hist.length ? `<div class="list">${hist.map(q => { const s=S.q[q.id]; return `<div class="it"><span class="q"><b>#${q.id}</b> ${esc(q.q.length>110?q.q.slice(0,110)+"…":q.q)}</span><span class="pill ${s.wa?'bad':'ok'}">${s.wa?'Sai':'Đã sửa'} · ${s.w}×</span></div>`; }).join("")}</div>` : `<div class="empty">Chưa có câu sai nào. Hãy luyện tập hoặc thi thử!</div>`}</div>`;
}
function startWrong(){ const ids = shuffle(wrongIds()); W.list = ids.map(id => ({ id, o: makeOptions(QMAP[id]), pick:null })); W.i = 0; W.running = true; render(); }
function renderWrongRun(){
  if (!W.list.length) { W.running=false; return renderWrong(); }
  const left = W.list.filter(x => x.pick===null).length;
  const head = `<div class="sec-title" style="margin-bottom:10px"><h2 style="margin:0">Làm lại câu sai</h2><button class="btn ghost" style="min-height:40px;padding:6px 14px" onclick="W.running=false;render()">Thoát</button></div>`;
  if (W.i >= W.list.length) {
    const still = wrongIds().length;
    return head + `<div class="card empty"><div style="font-size:36px">${still?'💪':'🎉'}</div><b>${still?`Còn ${still} câu chưa đúng`:'Đã sửa hết câu sai!'}</b><div class="row" style="margin-top:14px">${still?`<button class="btn" onclick="startWrong()">Làm lại các câu còn sai</button>`:''}<button class="btn ghost" onclick="W.running=false;render()">Về danh sách</button></div></div>`;
  }
  return head + questionCard(W, "wrongPick", "wrongNav", true) + `<div class="muted" style="text-align:center;font-size:13px;margin-top:8px">Còn ${left} câu chưa trả lời trong lượt này</div>`;
}
function wrongPick(k){ const it = W.list[W.i]; if (it.pick!==null) return; it.pick = k; record(it.id, k===it.o.correct); render(); renderTabs(); }
function wrongNav(d){ if (d>0 && W.i === W.list.length-1) { W.i++; } else W.i = Math.max(0, Math.min(W.list.length-1, W.i+d)); render(); window.scrollTo(0,0); }

// Ghi đè nút "Tiếp" ở câu cuối của chế độ câu sai để hiện màn kết thúc
const _qc = questionCard;
questionCard = function(ctx, pickFn, navFn, wrongMode){
  let h = _qc(ctx, pickFn, navFn, wrongMode);
  if (wrongMode && ctx.i === ctx.list.length-1) h = h.replace(/<button class="btn" disabled onclick="wrongNav\(1\)">Tiếp ›<\/button>/, `<button class="btn" onclick="wrongNav(1)">Kết thúc ›</button>`);
  return h;
};

// ---------- khởi động ----------
$("#subtitle").innerHTML = `${QUESTIONS.length} câu · ${Object.keys(TOPICS).length} chủ đề · <span style="color:#e11d48;font-weight:600">Hoàng Anh yêu Hoa</span>`;
renderTabs(); render();
window.addEventListener("beforeunload", e => { if (E && E.running) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const k = e.key.toUpperCase(); const idx = "ABCD".indexOf(k) >= 0 ? "ABCD".indexOf(k) : "1234".indexOf(e.key);
  if (view==="card" && (e.key===" "||e.key==="Enter")) { e.preventDefault(); flipCard(); return; }
  if (idx >= 0){
    if (view==="prac" && P.list && P.list.length) pracPick(idx);
    else if (view==="exam" && E && E.running) examPick(idx);
    else if (view==="wrong" && W.running && W.i < W.list.length) wrongPick(idx);
  }
  if (e.key==="ArrowRight"){ if(view==="prac") pracNav(1); else if(view==="exam"&&E&&E.running) examNav(1); }
  if (e.key==="ArrowLeft"){ if(view==="prac") pracNav(-1); else if(view==="exam"&&E&&E.running) examNav(-1); }
});
</script>


</body></html>
